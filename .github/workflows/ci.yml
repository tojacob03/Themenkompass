name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    name: Python pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (fictional fixtures, no network)
        run: uv run pytest --cov=themenkompass --cov-report=term-missing
      - name: Validate committed data files
        run: uv run python -m themenkompass.checks
