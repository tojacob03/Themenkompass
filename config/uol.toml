# Themenkompass configuration: Carl von Ossietzky Universität Oldenburg
#
# Everything institution-specific lives here. To add another university, copy this
# file, change [institution], and build the [[units]] list from the output of
#   uv run themenkompass --config config/<slug>.toml affiliations --unmatched

[institution]
slug = "uol"
ror = "033n9gh91"             # https://ror.org/033n9gh91
openalex_id = "I129877168"    # https://openalex.org/I129877168
name_de = "Carl von Ossietzky Universität Oldenburg"
name_en = "Carl von Ossietzky University of Oldenburg"
# A raw affiliation string only counts as evidence for a unit below if it also
# contains one of these names (case-insensitive substring).
aliases = [
  "Carl von Ossietzky",
  "Carl-von-Ossietzky",
  "University of Oldenburg",
  "Universität Oldenburg",
  "Universitaet Oldenburg",
  "Oldenburg University",
  "Univ. Oldenburg",
  "Uni Oldenburg",
  "Universitat Oldenburg",
]

[scope]
window_years = 10            # rolling window ending in the current year
min_works_per_person = 2     # people with fewer works in the window are not listed
max_authors_for_network = 25 # larger author teams are left out of the co-author network
recent_years = 5             # "recent works" on person pages

[budget]
# The free OpenAlex allowance is $1/day with a key, $0.10/day without.
# A full run for this institution costs roughly $0.02.
max_usd_per_run = 0.25
min_remaining_usd = 0.02
max_requests_per_run = 2000

# ---------------------------------------------------------------------------
# Organisation. OpenAlex knows the university, not its faculties or departments.
# Units are recognised from the raw affiliation text that authors print on their
# papers (English and German variants). Patterns are case-insensitive regular
# expressions. A unit with a `parent` replaces its parent when both match.
# Faculty patterns catch strings that name only the faculty ("School of ...").
# Structure as listed on https://uol.de/fakultaeten (checked 2026-09-29).
# ---------------------------------------------------------------------------

[[faculties]]
id = "fk1"
name_de = "Fakultät I – Bildungs- und Sozialwissenschaften"
name_en = "Faculty I – Education and Social Sciences"
patterns = ["Education(al)? and Social Sciences", "Bildungs- und Sozialwissenschaften", "Fakult(ä|ae)t I\\b"]

[[faculties]]
id = "fk2"
name_de = "Fakultät II – Informatik, Wirtschafts- und Rechtswissenschaften"
name_en = "Faculty II – Computer Science, Business Administration, Economics and Law"
patterns = ["Computing Science, Business Administration", "Informatik, Wirtschafts- und Rechtswissenschaften", "Fakult(ä|ae)t II\\b"]

[[faculties]]
id = "fk3"
name_de = "Fakultät III – Sprach- und Kulturwissenschaften"
name_en = "Faculty III – Linguistics and Cultural Studies"
patterns = ["(Languages?|Linguistics) and Cultural Studies", "Sprach- und Kulturwissenschaften", "Fakult(ä|ae)t III\\b"]

[[faculties]]
id = "fk4"
name_de = "Fakultät IV – Human- und Gesellschaftswissenschaften"
name_en = "Faculty IV – Humanities and Social Sciences"
patterns = ["Humanities and Social Sciences", "Human- und Gesellschaftswissenschaften", "Fakult(ä|ae)t IV\\b"]

[[faculties]]
id = "fk5"
name_de = "Fakultät V – Mathematik und Naturwissenschaften"
name_en = "Faculty V – Mathematics and Science"
patterns = ["(School|Faculty) of Mathematics and (Natural )?Sciences?", "Mathematik und Naturwissenschaften", "Fakult(ä|ae)t V\\b"]

[[faculties]]
id = "fk6"
name_de = "Fakultät VI – Medizin und Gesundheitswissenschaften"
name_en = "Faculty VI – Medicine and Health Sciences"
patterns = ["Medicine and Health Sciences", "Medizin und Gesundheitswissenschaften", "European Medical School", "University Medicine Oldenburg", "Universitätsmedizin Oldenburg", "Fakult(ä|ae)t VI\\b", "Medicine (and|&) Health Sciences", "Gesundheitswissenschaften"]

