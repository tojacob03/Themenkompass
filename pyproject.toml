[project]
name = "themenkompass"
version = "0.1.0"
description = "Who researches what at a university, how actively, and with whom - built on OpenAlex."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Till Oscar Jacob" }]
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
]

[project.scripts]
themenkompass = "themenkompass.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/themenkompass"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "RET"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
